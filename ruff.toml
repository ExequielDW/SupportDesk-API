# Configuración de ruff (linter). Ejecutar: ruff check .
target-version = "py310"
line-length = 100

[lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "BLE"]
ignore = [
    "B008",    # FastAPI: Depends() como valor por defecto es el patrón oficial
    "E501",    # el largo de línea se revisa a ojo
    "SIM105",  # contextlib.suppress no siempre es más claro
]

[lint.per-file-ignores]
"tests/*" = ["B011"]
"scripts/*" = ["E402"]
